summary: >-
  Derived from the 930 JSON Schema definitions Moz's own documentation application serves. The model
  splits cleanly in two: a read-only analytics graph in the "data" namespace, keyed on a site query
  rather than on issued identifiers, and a conventional CRUD graph in the "local" namespace keyed on
  numeric account / group / location ids. There is no cross-namespace foreign key - a Moz Local
  location and a Moz Data site are not joined by the API.
identifier_style:
  data_namespace: >-
    No object ids. The primary key is a DataSiteQueryInput (a query string plus a scope of page,
    subdomain or domain), and Moz echoes the parsed DataSiteQueryObject back on every response so a
    caller can see how its input was interpreted. Keyword records are keyed on a DataSerpQueryObject
    (keyword + locale + device + engine + vicinity).
  local_namespace: >-
    Integer/opaque ids - LocationId, AccountId, GroupId - plus remote_id and remote_network_id
    fields carrying the identifier held by the downstream listing network.
  no_prefixed_ids: >-
    Moz does not use type-prefixed identifiers (no "loc_", "acct_" style); ids are bare.
