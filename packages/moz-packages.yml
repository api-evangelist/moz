summary: >-
  Moz ships no maintained first-party client library for the current JSON-RPC API. Its docs give
  cURL / Python / JavaScript snippets written against a raw HTTP client rather than an SDK, and no
  SDK, client-library or download section exists anywhere in the API documentation. Every
  first-party package that ever existed targets the retired Linkscape / Mozscape generation of the
  API and has been unmaintained for a decade or more. Everything currently on npm and Packagist
  under a "moz" name is third-party.
