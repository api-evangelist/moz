aid: moz
name: Moz
description: >-
  Moz is a Seattle-based search-marketing software company, founded in 2004 as SEOmoz and part of
  Ziff Davis since 2021, whose products include Moz Pro, Moz Local, STAT and Moz Data. Its developer
  surface is the Moz API, a JSON-RPC 2.0 API served from a single universal endpoint at
  https://api.moz.com/jsonrpc, exposing 62 public methods across five namespaces: site metrics
  (Domain Authority, Page Authority, Brand Authority, Spam Score), the Moz Link Index (links, linking
  root domains, anchor text, link intersect, link status, final redirect), keyword metrics (volume,
  difficulty, opportunity, priority, search intent, related keywords), ranking and top-page data, and
  Moz Local location, group, account, listing-network and Google Business Profile insight management.
  Requests are authenticated with a Moz API token in an x-moz-token header, billed against a
  row-based monthly quota, and Moz additionally runs two beta remote MCP servers - Moz Data and Moz
  Local - at https://api.moz.com/mcp/v1/data and https://api.moz.com/mcp/v1/local, protected by
  OAuth 2.1 with PKCE and RFC 9728 protected-resource metadata.
