- name: Moz MCP Server - Data
  description: >-
    Beta remote Model Context Protocol server exposing Moz Data API tools (site metrics, links,
    keywords, rankings) to LLM hosts such as Claude Desktop, ChatGPT Desktop and Claude Code.
    Streamable HTTP transport; OAuth 2.1 sign-in inside the client, or an Authorization Bearer
    header carrying a Moz API key. Requires a Moz Data API subscription; access is limited to
    account owners during beta.
  humanURL: https://moz.com/api/docs/guides/mcp-servers
  baseURL: https://api.moz.com/mcp/v1/data
  tags:
  - MCP
  - Agents
  - SEO
  properties:
  - type: MCPServer
    url: mcp/moz-mcp.yml
  - type: Documentation
    url: https://moz.com/api/docs/guides/mcp-servers
  - type: OAuthScopes
    url: scopes/moz-scopes.yml
- name: Moz MCP Server - Local
  description: >-
    Beta remote Model Context Protocol server exposing Moz Local tools for managing and reporting on
    business locations and listings. Streamable HTTP transport; OAuth 2.1 sign-in inside the client,
    or an Authorization Bearer header carrying a Moz API key. Requires a Moz Local subscription;
    access is limited to account owners during beta.
  humanURL: https://moz.com/api/docs/guides/mcp-servers
  baseURL: https://api.moz.com/mcp/v1/local
