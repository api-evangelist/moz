apis:
- name: Moz API
  description: >-
    The Moz API is a JSON-RPC 2.0 API accessed through HTTP POST requests to a single universal
    endpoint, https://api.moz.com/jsonrpc. The method name in the request body selects the operation.
    62 public methods cover site metrics, the Moz Link Index, keyword metrics, ranking keywords, top
    pages, global top domains/pages, Moz Local location and listing management, index metadata and
    quota lookup. Authentication is a secret Moz API token supplied in the custom x-moz-token header.
  humanURL: https://moz.com/products/api
  baseURL: https://api.moz.com/jsonrpc
  tags:
